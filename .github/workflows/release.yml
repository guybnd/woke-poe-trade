name: Release

# Push a tag like v0.1.0 (it must match main/package.json "version") to build
# the Windows installer and attach it to a DRAFT release. Players and the
# auto-updater only see it after someone presses Publish on GitHub.
#
# Or run it by hand on master: it drafts v<main/package.json version> from that
# commit, with the notes given, and with "publish" ticked it publishes the draft
# (GitHub then makes the tag). That needs no tag push, so it works from anywhere
# that can start a workflow.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (Markdown)
        required: false
        default: ''
      publish:
        description: Publish the release once every file is on it
        type: boolean
        default: false

permissions:
  contents: write
  # Build provenance: a signed record, checkable by anyone, that the installer
  # was built here from this tag (gh attestation verify <file> -R guybnd/woke-poe-trade).
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22
    - name: Check tag matches version
      shell: bash
      run: |
        version=$(node -p "require('./main/package.json').version")
        if [[ "$GITHUB_REF" == refs/tags/* && "v$version" != "$GITHUB_REF_NAME" ]]; then
          echo "Tag $GITHUB_REF_NAME does not match main/package.json version $version"
          exit 1
        fi
        # major.LEAGUE.patch: 3.30 is 1.330.x, a 4.0 league 1.400.x (DEVELOPING.md).
        if [[ ! "$version" =~ ^[1-9][0-9]*\.[1-9][0-9]{2}\.(0|[1-9][0-9]*)$ ]]; then
          echo "Version $version is not major.LEAGUE.patch (e.g. 1.330.0). See 'Version numbers' in DEVELOPING.md."
          exit 1
        fi
        echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
    # One draft, made before packaging. electron-builder uploads the installer,
    # the portable exe and the blockmap at once, and with no release there yet
    # each upload made its own draft: the stray blockmap-only drafts on every
    # release so far. With this one in place they all find it.
    - name: Draft the release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NOTES: ${{ inputs.notes }}
      run: |
        found=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$RELEASE_TAG\")] | map(if .draft then \"draft\" else \"published\" end) | join(\" \")")
        if [[ "$found" == *published* ]]; then
          echo "$RELEASE_TAG is already published. Bump main/package.json first."
          exit 1
        fi
        if [ -z "$found" ]; then
          gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Woke PoE Trade ${RELEASE_TAG#v}" --notes "$NOTES" -R "$GITHUB_REPOSITORY"
        elif [ -n "$NOTES" ]; then
          gh release edit "$RELEASE_TAG" --notes "$NOTES" -R "$GITHUB_REPOSITORY"
        fi
    - run: npm ci
      working-directory: ./renderer
    - run: npm run build
      working-directory: ./renderer
    - run: npm ci
      working-directory: ./main
    - run: npm run build
      working-directory: ./main
    # releaseType: draft in electron-builder.yml keeps the release unpublished.
    # Code signing: electron-builder signs when a certificate is set in the repo
    # secrets (WIN_CSC_LINK = base64 .pfx, WIN_CSC_KEY_PASSWORD) and builds
    # unsigned, as before, when they're empty. See SECURITY.md.
    - run: npm run package -- --win -p always
      working-directory: ./main
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    - name: Checksums
      shell: bash
      working-directory: ./main/dist
      run: |
        sha256sum *.exe > SHA256SUMS.txt
        cat SHA256SUMS.txt
    - name: Build provenance
      uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
      with:
        subject-path: main/dist/*.exe
    # Next to the installers on the draft release, so players can check a download.
    - name: Attach checksums to the release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "$RELEASE_TAG" main/dist/SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
    # Every file on one release, and no second draft for this tag left behind.
    - name: Check the release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        version=${RELEASE_TAG#v}
        ids=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft) | .id")
        if [ "$(echo "$ids" | grep -c .)" != "1" ]; then
          echo "Expected one draft for $RELEASE_TAG, found: $ids"
          exit 1
        fi
        assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ids" --jq '[.assets[].name] | join(" ")')
        echo "Files: $assets"
        for f in "Woke-PoE-Trade-Setup-$version.exe" "Woke-PoE-Trade-Setup-$version.exe.blockmap" "Woke-PoE-Trade-$version-portable.exe" latest.yml SHA256SUMS.txt; do
          [[ " $assets " == *" $f "* ]] || { echo "Missing $f"; exit 1; }
        done
    - name: Publish
      if: ${{ inputs.publish && github.ref == 'refs/heads/master' }}
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release edit "$RELEASE_TAG" --draft=false --latest -R "$GITHUB_REPOSITORY"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: windows-installer
        path: |
          main/dist/*.exe
          main/dist/latest.yml
          main/dist/SHA256SUMS.txt
        retention-days: 14
