name: Docs

# The site (landing page + help pages) deploys from master only: GitHub Pages
# takes deploys from the default branch. It also reads the module list and the
# app version, and builds the overlay for the browser demo (docs/demo), so
# those changes redeploy it too.
on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'renderer/**'
      - 'testing/fixtures/http/**'
      - 'testing/fixtures/screens/landing/**'
      - 'main/package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pages refuses a deploy while another is running, so close merges wait their
# turn. The newest waiting one wins, as it has everything the others had.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: ./docs
      - run: npm ci
        working-directory: ./renderer
      - run: npx vitepress build
        working-directory: ./docs
      - run: node scripts/build-demo.mjs
        working-directory: ./docs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./docs/.vitepress/dist
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4