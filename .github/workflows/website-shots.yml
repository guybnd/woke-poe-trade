name: Website shots

# Retakes every picture and clip on the website (docs/public/shots, clips) from
# the branch's own app: the landing specs in testing/e2e, on the fake game,
# where web.poecdn.com's item art loads. The new pictures are committed back
# to the branch, with any item icons the fixtures lacked
# (testing/fixtures/icons), so later runs anywhere look the same.
#
# Runs when asked (Actions > Website shots > Run workflow, on any branch but
# master), or on a push to a branch whose last commit says [shots].
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'master'

concurrency:
  group: website-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: Retake website shots
    if: ${{ github.ref != 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          renderer/package-lock.json
          main/package-lock.json
          testing/package-lock.json
    - uses: ./.github/actions/fake-game-setup
    - name: Install ffmpeg (for the clips)
      run: sudo apt-get install -y --no-install-recommends ffmpeg
    # One worker: the specs share one fake app per file, and a full run in
    # parallel can leave one test's card over another's shot.
    - name: Take the pictures
      run: npx playwright test e2e/landing-highlights.spec.ts e2e/landing-shots.spec.ts --workers 1 --retries 1 --trace off --reporter=list,github
      working-directory: ./testing
      env:
        WOKE_LANDING_SHOTS: '1'
        WOKE_SAVE_ICONS: '1'
    - name: Record the clips
      if: ${{ !cancelled() }}
      run: npx playwright test e2e/landing-highlights.spec.ts -g "clip:" --workers 1 --retries 1 --trace off --reporter=list,github
      working-directory: ./testing
      env:
        WOKE_LANDING_CLIPS: '1'
        WOKE_SAVE_ICONS: '1'
    - name: Commit the new pictures to the branch
      if: ${{ !cancelled() }}
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898+github-actions[bot]@users.noreply.github.com'
        git add docs/public/shots docs/public/clips testing/fixtures/icons
        if git diff --cached --quiet; then echo 'No picture changed.'; exit 0; fi
        git diff --cached --stat | tail -1
        git commit -m 'Website: retake shots and clips from the app on this branch'
        git push origin "HEAD:${GITHUB_REF_NAME}"
    - name: Upload the report
      if: ${{ failure() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: website-shots-report
        path: testing/report
        retention-days: 3
