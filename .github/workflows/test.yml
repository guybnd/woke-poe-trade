name: Tests

# Runs on every pull request: unit tests, type checks, and the fake-game
# tests (the real app driven by a fake Path of Exile; see testing/README.md).
# A pull request that only touches the website skips the work: see `changes`.
on:
  pull_request:
  push:
    branches:
      - 'master'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides what a pull request needs. Both checks below are required on master,
  # so they can't use a path filter: a check that never reports blocks the merge
  # forever, while a job skipped by its `if` reports as passed. Pushes to master
  # always run everything. If this job fails, its outputs are empty and both
  # jobs still run (they test `!= 'false'`). So a landing spec that no longer
  # loads fails here and sends the pull request through the full tests, where
  # it fails a required check; failing this job alone wouldn't block a merge.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      unit: ${{ steps.result.outputs.unit }}
      game: ${{ steps.result.outputs.game }}
    steps:
    - id: files
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        unit=true
        game=true
        landing=false
        if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          # GitHub lists at most 3000 files, so a list that long may be cut short.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)') || files=
          if [ -n "$files" ] && [ "$(printf '%s\n' "$files" | wc -l)" -lt 3000 ]; then
            unit=false
            game=false
            while IFS= read -r file; do
              case "$file" in
                # Only the website and its screenshots use these.
                docs/*|testing/fixtures/screens/frames/*|testing/fixtures/lab-layout.jpg) ;;
                testing/e2e/landing-*.spec.ts) landing=true ;;
                # A unit test checks the README's module table.
                README.md) unit=true ;;
                *) unit=true; game=true ;;
              esac
            done <<< "$files"
          fi
        fi
        echo "Unit tests: $unit, fake-game tests: $game"
        echo "unit=$unit" >> "$GITHUB_OUTPUT"
        echo "game=$game" >> "$GITHUB_OUTPUT"
        echo "landing=$landing" >> "$GITHUB_OUTPUT"
    - if: steps.files.outputs.landing == 'true'
      uses: actions/checkout@v6
    - if: steps.files.outputs.landing == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: testing/package-lock.json
    - name: Check the landing specs still load
      if: steps.files.outputs.landing == 'true'
      working-directory: ./testing
      run: |
        npm ci
        npx playwright test --list e2e/landing- > /dev/null
    - id: result
      env:
        UNIT: ${{ steps.files.outputs.unit }}
        GAME: ${{ steps.files.outputs.game }}
      run: |
        echo "unit=$UNIT" >> "$GITHUB_OUTPUT"
        echo "game=$GAME" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit tests, lint, types
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.unit != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          renderer/package-lock.json
          main/package-lock.json
    - run: npm ci
      working-directory: ./renderer
    # Before the renderer's checks too: its tests import some of main's code.
    # Only the TypeScript and plain JS are used; the native modules and Electron
    # itself aren't needed for that.
    - run: npm ci --ignore-scripts
      working-directory: ./main
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    - run: npm run lint
      working-directory: ./renderer
    - name: Type check (app + tests)
      run: npm run typecheck:test
      working-directory: ./renderer
    - name: Unit tests
      run: npm test
      working-directory: ./renderer
    - name: Type check (main)
      run: npx tsc --noEmit
      working-directory: ./main

  game:
    name: Fake-game tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.game != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          renderer/package-lock.json
          main/package-lock.json
          testing/package-lock.json
    - run: npm ci
      working-directory: ./renderer
    - name: Build the overlay
      run: npx vite build
      working-directory: ./renderer
    # main's code runs in the fake app with Electron and the native hooks
    # replaced by the fake game, so their install scripts are skipped.
    - run: npm ci --ignore-scripts
      working-directory: ./main
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    - run: npm ci
      working-directory: ./testing
    - name: Cache OCR files
      uses: actions/cache@v4
      with:
        path: testing/.cache/cv-ocr
        key: cv-ocr-v3.20.10007
    - name: Get OCR files (opencv + tesseract, from APT's release)
      run: npm run get:ocr
      working-directory: ./testing
    # Ubuntu's mirrors sometimes crawl (8.5 minutes for 22 MB), so Chromium's system
    # packages are kept between runs. Any that changed are downloaded as usual.
    - name: Cache Chromium's system packages
      uses: actions/cache@v4
      with:
        path: ~/apt-debs
        key: apt-debs-${{ runner.os }}-${{ hashFiles('testing/package-lock.json') }}
        restore-keys: apt-debs-${{ runner.os }}-
    - name: Install Chromium
      run: |
        mkdir -p ~/apt-debs
        sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
        echo "Packages from the cache: $(ls ~/apt-debs | wc -l)"
        npx playwright install --with-deps chromium
        cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
        echo "Packages to keep: $(ls ~/apt-debs | wc -l)"
      working-directory: ./testing
    - name: OCR tests
      run: npm run test:main
      working-directory: ./testing
    - name: Overlay tests on the fake game
      run: npx playwright test
      working-directory: ./testing
    # Every module on: startup, a map, opening the overlay, a price check,
    # memory. Counts and sizes over testing/perf/budgets.json fail the run.
    - name: Performance checks
      run: npx playwright test -c playwright.perf.config.ts
      working-directory: ./testing
    # The real Electron app (not the fake host): overlay page loads, <webview>
    # works, process count and memory. See testing/electron/smoke.mjs.
    - name: Get Electron
      run: node node_modules/electron/install.js
      working-directory: ./main
    - name: Build main
      run: node build/script.mjs --prod
      working-directory: ./main
    - name: Real Electron smoke test
      run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:electron
      working-directory: ./testing
    - name: Upload report (screenshots of every scenario)
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: fake-game-report
        path: |
          testing/report
          testing/test-results
          testing/perf-results
        retention-days: 14
