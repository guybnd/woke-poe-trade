name: Tests

# Runs on every pull request: unit tests, type checks, and the fake-game
# tests (the real app driven by a fake Path of Exile; see testing/README.md).
# A pull request that only touches the website skips the work: see `changes`.
on:
  pull_request:
  push:
    branches:
      - 'master'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides what a pull request needs. If a master ruleset requires the checks
  # below, they can't use a path filter: a check that never reports blocks the merge
  # forever, while a job skipped by its `if` reports as passed. Pushes to master
  # always run everything. If this job fails, its outputs are empty and all
  # jobs still run (they test `!= 'false'`). So a landing spec that no longer
  # loads fails here and sends the pull request through the full tests, where
  # it fails a required check; failing this job alone wouldn't block a merge.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      unit: ${{ steps.result.outputs.unit }}
      game: ${{ steps.result.outputs.game }}
      package: ${{ steps.result.outputs.package }}
      site: ${{ steps.files.outputs.site }}
    steps:
    - id: files
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        unit=true
        game=true
        package=true
        landing=false
        site=true
        if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          # GitHub lists at most 3000 files, so a list that long may be cut short.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)') || files=
          if [ -n "$files" ] && [ "$(printf '%s\n' "$files" | wc -l)" -lt 3000 ]; then
            unit=false
            game=false
            package=false
            site=false
            while IFS= read -r file; do
              case "$file" in
                # Only the website and its screenshots use these.
                docs/*) site=true ;;
                testing/fixtures/screens/frames/*|testing/fixtures/lab-layout.jpg) ;;
                testing/e2e/landing-*.spec.ts) landing=true ;;
                # The landing page reads the module list, fonts and frame art
                # from the app, and the version from main.
                renderer/*) unit=true; game=true; site=true ;;
                # Install and packaging live in main/ and the workflows.
                main/package.json) unit=true; game=true; site=true; package=true ;;
                main/*|.github/workflows/*) unit=true; game=true; package=true ;;
                # A unit test checks the README's module table.
                README.md) unit=true ;;
                *) unit=true; game=true ;;
              esac
            done <<< "$files"
          fi
        fi
        echo "Unit tests: $unit, fake-game tests: $game, Windows package: $package"
        echo "unit=$unit" >> "$GITHUB_OUTPUT"
        echo "game=$game" >> "$GITHUB_OUTPUT"
        echo "package=$package" >> "$GITHUB_OUTPUT"
        echo "landing=$landing" >> "$GITHUB_OUTPUT"
        echo "site=$site" >> "$GITHUB_OUTPUT"
    - if: steps.files.outputs.landing == 'true'
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - if: steps.files.outputs.landing == 'true'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: testing/package-lock.json
    - name: Check the landing specs still load
      if: steps.files.outputs.landing == 'true'
      working-directory: ./testing
      run: |
        npm ci
        npx playwright test --list e2e/landing- > /dev/null
    - id: result
      env:
        UNIT: ${{ steps.files.outputs.unit }}
        GAME: ${{ steps.files.outputs.game }}
        PACKAGE: ${{ steps.files.outputs.package }}
      run: |
        echo "unit=$UNIT" >> "$GITHUB_OUTPUT"
        echo "game=$GAME" >> "$GITHUB_OUTPUT"
        echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

  # The website built as Pages builds it, then checked at phone and desktop
  # sizes (docs/scripts/check-phone.mjs). Only when docs/ changed.
  site:
    name: Website on phones
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.site != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          docs/package-lock.json
          renderer/package-lock.json
    - run: npm ci
      working-directory: ./docs
    # The landing page reads the module list from the app.
    - run: npm ci
      working-directory: ./renderer
    - run: npx vitepress build
      working-directory: ./docs
    - run: npx playwright install --with-deps chromium
      working-directory: ./docs
    - run: node scripts/check-phone.mjs
      working-directory: ./docs

  unit:
    name: Unit tests, lint, types
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.unit != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          renderer/package-lock.json
          main/package-lock.json
    - run: npm ci
      working-directory: ./renderer
    # Before the renderer's checks too: its tests import some of main's code.
    # Only the TypeScript and plain JS are used; the native modules and Electron
    # itself aren't needed for that.
    - run: npm ci --ignore-scripts
      working-directory: ./main
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    - run: npm run lint
      working-directory: ./renderer
    - name: Type check (app + tests)
      run: npm run typecheck:test
      working-directory: ./renderer
    - name: Unit tests
      run: npm test
      working-directory: ./renderer
      env:
        # The loot filter guard's pairs and random mixes: master only.
        WOKE_FULL_GUARD: ${{ github.event_name != 'pull_request' && '1' || '' }}
    - name: Type check (main)
      run: npx tsc --noEmit
      working-directory: ./main

  # The fake-game tests run as three jobs side by side: the overlay tests in
  # two halves (game-e2e) and the OCR, performance and real Electron checks
  # (game-checks). "Fake-game tests" waits for all three and fails if any did.
  # A master ruleset requires that name, so keep it on the last job.
  game-e2e:
    name: Fake-game e2e (${{ matrix.shard }}/2)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.game != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          renderer/package-lock.json
          main/package-lock.json
          testing/package-lock.json
    - uses: ./.github/actions/fake-game-setup
    # The blob report carries screenshots and traces; the last job merges the
    # halves into one HTML report.
    - name: Overlay tests on the fake game
      run: npx playwright test --shard=${{ matrix.shard }}/2 --reporter=blob,github,list
      working-directory: ./testing
    - name: Upload this half's report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: fake-game-blob-${{ matrix.shard }}
        path: testing/blob-report
        retention-days: 2

  game-checks:
    name: Fake-game OCR, perf, Electron
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.game != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          renderer/package-lock.json
          main/package-lock.json
          testing/package-lock.json
    - uses: ./.github/actions/fake-game-setup
    - name: OCR tests
      run: npx vitest run
      working-directory: ./testing
    # Every module on: startup, a map, opening the overlay, a price check,
    # memory. Counts and sizes over testing/perf/budgets.json fail the run.
    - name: Performance checks
      run: npx playwright test -c playwright.perf.config.ts
      working-directory: ./testing
    # The real Electron app (not the fake host): overlay page loads, <webview>
    # works, process count and memory. See testing/electron/smoke.mjs.
    # Electron's zip comes from GitHub releases, which sometimes answers 504 for
    # a while. Keep it between runs, and try a few times when it isn't kept yet.
    - name: Cache Electron
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .electron-cache
        key: electron-${{ runner.os }}-${{ hashFiles('main/package-lock.json') }}
        restore-keys: electron-${{ runner.os }}-
    - name: Get Electron
      run: |
        for try in 1 2 3 4; do
          node node_modules/electron/install.js && exit 0
          [ "$try" = 4 ] && exit 1
          echo "Electron download failed (try $try), waiting $((try * 30)) s"
          sleep $((try * 30))
        done
      working-directory: ./main
      env:
        electron_config_cache: ${{ github.workspace }}/.electron-cache
    - name: Build main
      run: node build/script.mjs --prod
      working-directory: ./main
    - name: Real Electron smoke test
      run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:electron
      working-directory: ./testing
    - name: Upload perf results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: fake-game-perf
        path: |
          testing/perf-results
          testing/test-results
        retention-days: 14

  game:
    name: Fake-game tests
    needs: [changes, game-e2e, game-checks]
    if: ${{ !cancelled() && needs.changes.outputs.game != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: testing/package-lock.json
    - run: npm ci
      working-directory: ./testing
    # A half that was cancelled or broke before its upload leaves nothing here;
    # the last step still fails the job for it.
    - name: Get both halves' reports
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: fake-game-blob-*
        path: testing/all-blob
        merge-multiple: true
    # Exits 1 when a test failed; the steps after it still run, and the last
    # one fails the job.
    - name: Merge into one report
      if: ${{ hashFiles('testing/all-blob/*.zip') != '' }}
      continue-on-error: true
      run: npx playwright merge-reports --reporter=html,json ./all-blob
      working-directory: ./testing
      env:
        PLAYWRIGHT_HTML_OUTPUT_DIR: report
        PLAYWRIGHT_HTML_OPEN: never
        PLAYWRIGHT_JSON_OUTPUT_NAME: report/results.json
    # A retry turns a flaky test green, so the run alone never shows it.
    - name: List flaky and failed tests
      if: ${{ !cancelled() && hashFiles('testing/report/results.json') != '' }}
      run: node tools/flaky-summary.mjs report/results.json >> "$GITHUB_STEP_SUMMARY"
      working-directory: ./testing
    - name: Upload report (screenshots of every scenario)
      if: ${{ !cancelled() && hashFiles('testing/report/index.html') != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: fake-game-report
        path: testing/report
        retention-days: 14
    - name: All fake-game jobs passed
      env:
        E2E: ${{ needs.game-e2e.result }}
        CHECKS: ${{ needs.game-checks.result }}
      run: |
        echo "Overlay tests: $E2E, OCR/perf/Electron: $CHECKS"
        [ "$E2E" = success ] && [ "$CHECKS" = success ]

  # The Windows installer built as release.yml builds it, without publishing,
  # so a broken install or package step fails a pull request instead of the
  # next release tag. Only when main/ or a workflow changed (and on master):
  # the Windows runner is slow. Windows only, since nothing else is released.
  package:
    name: Windows package
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.package != 'false' }}
    runs-on: windows-2022
    timeout-minutes: 40
    # Electron's zip comes from GitHub releases, which sometimes answers 504.
    # Keep it between runs (npm ci and electron-builder both read this cache).
    env:
      electron_config_cache: ${{ github.workspace }}/.electron-cache
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          renderer/package-lock.json
          main/package-lock.json
    - run: npm ci
      working-directory: ./renderer
    - run: npm run build
      working-directory: ./renderer
    - name: Cache Electron
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .electron-cache
        key: electron-${{ runner.os }}-${{ hashFiles('main/package-lock.json') }}
        restore-keys: electron-${{ runner.os }}-
    - run: npm ci
      working-directory: ./main
    - run: npm run build
      working-directory: ./main
    # Never publishes: releases come from release.yml (tags).
    - run: npm run package -- --win -p never
      working-directory: ./main
    - name: Test build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: windows-test-build
        path: main/dist/*.exe
        retention-days: 7
