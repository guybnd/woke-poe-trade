name: Build

on:
  push:
    branches:
      - 'master'
    tags-ignore:
      - '**'
    paths-ignore:
      - 'docs/**'
      - README.md

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
    - run: npm ci
      working-directory: ./renderer
    - run: npm run lint
      working-directory: ./renderer
    - run: npm run build
      working-directory: ./renderer
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: renderer-dist
        path: ./renderer/dist
        retention-days: 1

  package:
    needs: renderer
    strategy:
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: renderer-dist
        path: ./renderer/dist
    - run: npm ci
      working-directory: ./main
    - run: npm run build
      working-directory: ./main
    # woke: never publish from here; releases come from release.yml (tags).
    - run: npm run package "--" -p never
      working-directory: ./main
    - name: Test build
      if: ${{ startsWith(matrix.os, 'windows') }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: windows-test-build
        path: main/dist/*.exe
        retention-days: 7
    - name: Hash
      if: ${{ startsWith(matrix.os, 'windows') }}
      run: type .\main\dist\latest.yml
    - name: Hash
      if: ${{ startsWith(matrix.os, 'ubuntu') }}
      run: cat ./main/dist/latest-linux.yml
    - name: Hash
      if: ${{ startsWith(matrix.os, 'macos') }}
      run: cat ./main/dist/latest-mac.yml
