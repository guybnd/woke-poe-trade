# Keeps the commit-pinned GitHub Actions and the npm packages up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /main
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ['*']
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /renderer
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ['*']
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /testing
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ['*']
    open-pull-requests-limit: 1
