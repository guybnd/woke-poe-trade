# woke: our own app id, name and update feed, so an install never mixes with
# (or updates itself back to) the original Awakened PoE Trade.
appId: "io.github.guybnd.woke-poe-trade"
productName: "Woke PoE Trade"
publish:
  - provider: "github"
    owner: "guybnd"
    repo: "woke-poe-trade"
    # Releases are created as drafts; players only see them once published.
    releaseType: "draft"
npmRebuild: false
# Chromium's own UI strings (context menus, number and date formats) ship as
# one .pak per language: 55 of them, ~45 MB unpacked. Keep the languages PoE
# players mostly use; anything else falls back to English formats. The app's
# own languages (en, ru, ko, cmn-Hant) don't depend on these.
electronLanguages:
  - en-US
  - en-GB
  - de
  - fr
  - es
  - es-419
  - pt-BR
  - pt-PT
  - it
  - nl
  - pl
  - cs
  - sv
  - tr
  - ru
  - uk
  - ko
  - ja
  - zh-CN
  - zh-TW
  - th
files:
  - "package.json"
  - from: "dist"
    to: "."
    filter: ["main.js", "vision.js"]
  - from: "../renderer/dist"
    to: "."
extraMetadata:
  main: "main.js"
# OCR data (opencv + tesseract) for map scan, essence scan and death recap,
# fetched by build/fetch-ocr.mjs.
extraResources:
  - from: "build/cv-ocr"
    to: "cv-ocr"
nsis:
  # One click, per user: no admin prompt, installs to %LOCALAPPDATA%.
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Woke PoE Trade"
  artifactName: "Woke-PoE-Trade-Setup-${version}.${ext}"
  deleteAppDataOnUninstall: false
portable:
  artifactName: "Woke-PoE-Trade-${version}-portable.${ext}"
win:
  target:
  - "nsis"
  - "portable"
